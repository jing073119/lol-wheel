<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LOL 隨機輪盤</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #091428;
      color: #f0e6d2;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      color: #c8aa6e;
      font-size: 22px;
      margin: 10px 0 16px 0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .card {
      background: #111e2e;
      border: 1px solid #785a28;
      border-radius: 8px;
      padding: 12px 14px;
      width: 100%;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .label {
      font-size: 11px;
      color: #a09b8c;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value {
      font-size: 17px;
      font-weight: 700;
      color: #0ac8b9;
    }
    .item-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .badge {
      background: #1e282d;
      border: 1px solid #c89b3c;
      color: #f0e6d2;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .badge-boot {
      border-color: #0ac8b9;
      color: #0ac8b9;
      background: rgba(10, 200, 185, 0.1);
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 6px 0 16px;
      font-size: 14px;
      color: #c8aa6e;
    }
    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: #0ac8b9;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #1e3a5f, #0ac8b9);
      border: none;
      color: #091428;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(10, 200, 185, 0.4);
    }
    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
  </style>
</head>
<body>

  <h1>🎲 英雄聯盟挑戰輪盤</h1>

  <div class="card">
    <div class="label">分路</div>
    <div class="value" id="lane">尚未抽取</div>
  </div>

  <div class="card">
    <div class="label">英雄</div>
    <div class="value" id="champ">尚未抽取</div>
  </div>

  <div class="card">
    <div class="label">召喚師技能</div>
    <div class="value" id="spells">尚未抽取</div>
  </div>

  <div class="card">
    <div class="label">裝備配搭 (1鞋 + 5大裝)</div>
    <div class="item-box" id="items">
      <span class="badge" style="opacity:0.6">點擊下方按鈕抽取</span>
    </div>
  </div>

  <label class="toggle">
    <input type="checkbox" id="forceSmite" checked> 打野自動帶重擊
  </label>

  <button class="btn" onclick="spin()">🎲 隨機抽一局</button>

  <script>
    const lanes = ["上路 (Top)", "打野 (Jungle)", "中路 (Mid)", "下路 (ADC)", "輔助 (Support)"];
    const champions = [
      "厄薩斯","阿璃","阿卡莉","埃可尚","亞歷斯塔","安比薩","阿姆姆","艾妮維亞","安妮",
      "亞菲利歐","艾希","歐羅拉","翱銳龍獸","阿祈爾","巴德","貝爾薇斯","布里茨",
      "布蘭德","布朗姆","布蕾爾","凱特琳","卡蜜兒","卡莎碧雅","科加斯","庫奇",
      "達瑞斯","黛安娜","蒙多醫生","達瑞文","艾克","伊莉絲","伊芙琳","伊澤瑞爾",
      "費德提克","菲歐拉","飛斯","加里歐","剛普朗克","蓋倫","吶兒","古拉格斯",
      "葛雷夫","關","赫克林","漢默丁格","赫威","伊羅旖","伊瑞莉雅","埃爾文",
      "珍娜","嘉文四世","賈克斯","杰西","燼","吉茵珂絲","凱薩","克黎思妲",
      "卡瑪","卡爾瑟斯","卡薩丁","卡特蓮娜","凱爾","慨影","凱能","卡力斯",
      "鏡爪","克雷德","寇格魔","卡桑帝","勒布朗","李星","雷歐娜","莉莉婭",
      "麗珊卓","路西恩","露璐","拉克絲","墨菲特","馬爾札哈","茂凱","易大師",
      "米里歐","好運姐","魔鬥凱薩","魔甘娜","納菲芮","娜米","納瑟斯","納帝魯斯",
      "妮可","奈德麗","淣菈","夜曲","努努和威朗普","歐拉夫","奧莉安娜","鄂爾",
      "潘森","波比","派克","姬亞娜","葵恩","銳兒","烈娜塔．格萊斯克","雷尼克頓",
      "雷葛爾","雷玟","藍寶","雷茲","煞蜜拉","賽恩","希維爾","史加納",
      "索娜","索拉卡","斯溫","賽勒斯","星朵拉","貪啃奇","塔莉雅","塔隆",
      "塔里克","提摩","瑟雷西","崔絲塔娜","特朗德","泰達米爾","逆命","圖奇",
      "烏爾加特","法洛士","汎","維迦","威寇茲","薇可絲","菲艾","維克特",
      "弗拉迪米爾","弗力貝爾","沃維克","悟空","剎雅","齊勒斯","趙信","犽宿",
      "犽凝","約瑞科","悠咪","札克","劫","捷莉","希格斯","極靈","柔依","枷蘿"
    ];
    const spells = ["閃現","點燃","傳送","鬼步","虛弱","治癒","光盾","淨化"];
    const boots = ["狂戰士護脛","鍍板鋼蓋","水星之靴","愛歐尼亞之靴","法師之靴","迅速之靴","共生之底"];
    const legendaries = [
      "殘暴打擊","幽夢靈魂之劍","夜色緣界","席利妲咒怨","公理圓刃","狂妄","臨界點","褻瀆九頭蛇","狂風火炮","巨蛇之牙","衝擊火刃",
      "無盡之刃","多明尼克的問候","海妖殺手","嗜血者","幻影之舞","鬼索的狂暴之刃","芮蘭的花火","衝擊火炮","那歐疾刃","臨終度日","毀滅殞落王者之劍","史提克彈簧刀","雲湧",
      "三相之力","黑色切割者","斯特拉克手套","死亡之舞","瑪莫提斯深淵","貪婪九頭蛇","泰坦九頭蛇","星蝕","精進之矛","破船者","焚天","步履破壞者",
      "滅世者的死亡之冠","虛空之杖","中婭沙漏","女妖面紗","盧登之伴","殘影之燈","時光之杖","大天使之杖","黎安卓的折磨","峽谷製造者","宇宙境界","黑焰火炬","惡意","風暴狂湧","納什之牙","黑魔禁書","地平線焦點",
      "日炎聖盾","空洞輝耀","荊棘之甲","蘭頓之兆","自然之力","好戰者鎧甲","深淵面具","冰霜之心","無終恨意","凱尼克欺詐者","璀璨殘骸","冰脈護手","千變者賈修",
      "錫柯的聚合","日輪的加冕","希利亞的迴響","流水之杖","熾天使之擁","月石再生膽","米凱的祝福","騎士誓願","帝王指令","曙光神盾"
    ];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function pickMulti(arr, n) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    function spin() {
      const lane = pick(lanes);
      document.getElementById("lane").textContent = lane;
      document.getElementById("champ").textContent = pick(champions);

      let sp = [];
      if (lane.includes("打野") && document.getElementById("forceSmite").checked) {
        sp = ["重擊", pick(spells.filter(s => s !== "重擊"))];
      } else {
        sp = pickMulti(spells, 2);
      }
      document.getElementById("spells").textContent = sp.join(" + ");

      const boot = pick(boots);
      const items = pickMulti(legendaries, 5);
      const box = document.getElementById("items");
      box.innerHTML = `<span class="badge badge-boot">👟 ${boot}</span>` + 
        items.map(i => `<span class="badge">${i}</span>`).join("");
    }
  </script>
</body>
</html>
